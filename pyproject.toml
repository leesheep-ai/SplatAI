[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "splatai-backends"
version = "0.1.0"
description = "Process-level training backend contracts for SplatAI"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["splatai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
